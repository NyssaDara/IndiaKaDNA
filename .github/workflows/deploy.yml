name: Deploy IndiaKaDNA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug repository files
        run: |
          echo "COMMIT:"
          git rev-parse HEAD
          echo "APP IMPORT:"
          grep -n "HeritageScene" Frontend/src/App.jsx
          echo "COMPONENT FILE:"
          ls -la Frontend/src/ | grep -i heritagescene

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: Frontend
        run: npm ci

      - name: Build website
        working-directory: Frontend
        run: npm run build

      - name: Upload build
        uses: actions/upload-pages-artifact@v3
        with:
          path: Frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4